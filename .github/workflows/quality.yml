name: Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "components.json"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint and typecheck
        run: npm run check

      - name: Build
        run: npm run build
